
global:
  user: "your_ssh_login_user_name"
  ssh_port: 22
  deploy_dir: "/tidb-deploy"
  data_dir: "/tidb-data"

pd_servers:
  - host: 10.10.1.1
    config:
      replication:
        max-replicas: 1

# Nodes that deploy TiKV instances
tikv_servers:
  - host: 10.10.1.1

# This should be all machines to be monitored (TiKV cluster can be a subset of this list)
monitoring_servers:
  - host: 10.10.1.1

grafana_servers:
  - host: 10.10.1.1